name: Branch RED Verification

on:
  push:
    branches:
      - feature/product-auto-discovery

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run expected failing tests
        id: red
        continue-on-error: true
        run: pnpm test
      - name: Confirm RED state without failing workflow
        shell: bash
        run: |
          echo "Expected RED test outcome: ${{ steps.red.outcome }}"
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Expected tests to fail before implementation, but they passed."
            exit 1
          fi
