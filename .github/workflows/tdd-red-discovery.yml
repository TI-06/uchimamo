name: TDD Red Discovery

on:
  push:
    branches:
      - feature/discovery-new-popular

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Expected RED tests
        id: redtests
        continue-on-error: true
        run: pnpm vitest run scripts/discovery-policy.test.mjs scripts/discover-rakuten.test.mjs src/lib/discovered-products-page.test.ts
      - name: Verify tests are RED
        shell: bash
        run: |
          if [ "${{ steps.redtests.outcome }}" != "failure" ]; then
            echo "Expected tests to fail before implementation."
            exit 1
          fi
          echo "RED confirmed without failing the workflow."
