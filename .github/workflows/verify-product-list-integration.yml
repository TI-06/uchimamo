name: Verify Product List Integration

on:
  push:
    branches:
      - fix/integrate-discovered-products
    paths:
      - '.github/workflows/verify-product-list-integration.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Verify tests and build
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          pnpm vitest run src/lib/discovered-products-page.test.ts
          pnpm test
          pnpm build
      - name: Report verification outcome without failing workflow
        shell: bash
        run: echo "VERIFICATION_OUTCOME=${{ steps.verification.outcome }}"
